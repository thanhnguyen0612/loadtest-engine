# What a service team writes: build the image, then hand it to the DevOps-owned reusable
# workflow. Runs on demand, or on a PR labelled `loadtest` (and on every push to that PR).
name: sample-api-loadtest

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  build:
    # Same-repo PRs only: fork PRs never get a cluster. On `labeled`, only the `loadtest`
    # label triggers; on `synchronize`, the PR must already carry it. `loadtest` needs this
    # job, so it is skipped whenever this one is.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'loadtest') ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'loadtest'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and save image
        run: |
          docker build -t "sample-api:${GITHUB_SHA}" services/sample-api
          docker save -o "$RUNNER_TEMP/sample-api.tar" "sample-api:${GITHUB_SHA}"
      - uses: actions/upload-artifact@v7
        with:
          name: sample-api-image
          path: ${{ runner.temp }}/sample-api.tar
          retention-days: 1
          if-no-files-found: error

  loadtest:
    needs: build
    # At least what the reusable workflow requests (the GKE variant also needs id-token: write).
    permissions:
      contents: read
      pull-requests: write
    # Same repository, so the local path works and platform-repository can stay unset. From a
    # service's own repository: <org>/loadtest-engine/.github/workflows/loadtest-reusable.yml@<ref>
    # plus `platform-repository: <org>/loadtest-engine`.
    uses: ./.github/workflows/loadtest-reusable.yml
    with:
      config-path: services/sample-api/loadtest/loadtest.yaml
      image: localhost:5001/sample-api:${{ github.sha }}
      image-artifact: sample-api-image
      service: sample-api
