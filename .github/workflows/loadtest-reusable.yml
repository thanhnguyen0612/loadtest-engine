# Reusable load-test workflow, owned by DevOps. Service teams call it from their own workflow
# (see sample-api-loadtest.yml); they never write cluster plumbing themselves.
#
# Two checkouts: the caller's repository at the workspace root (config, seed, stubs,
# scenario), and the platform repository (CLI, chart, k6 runner, kind scripts) in `.platform/`.
# From another repository, call it as
#
#   uses: <org>/loadtest-engine/.github/workflows/loadtest-reusable.yml@<ref>
#   with:
#     platform-repository: <org>/loadtest-engine
#     platform-ref: <ref>          # the same ref as in `uses:`
#
# so the guardrails (caps, chart, runner) come from the platform's pinned ref, not from the
# service's PR. A private platform repository also needs a read token for that checkout.
#
# Prototype: the test cluster is a throwaway kind cluster on the runner, with a local registry
# on localhost:5001 (scripts/kind-up.sh). The image is handed over as a `docker save` artifact
# (`image-artifact`) and pushed to that registry - a stand-in for "image already in the
# company registry".
#
# On GKE (production path), grant `id-token: write` (caller and this workflow), and replace
# the "Install kind" and "Start kind cluster" steps with:
#
#   - uses: google-github-actions/auth@v3            # keyless (Workload Identity Federation)
#     with:
#       workload_identity_provider: ${{ vars.LOADTEST_WIF_PROVIDER }}   # infra/modules/gcp-github-wif
#       service_account: ${{ vars.LOADTEST_DEPLOYER_SA }}
#   - uses: google-github-actions/get-gke-credentials@v3
#     with:
#       cluster_name: ${{ vars.LOADTEST_CLUSTER }}
#       location: ${{ vars.LOADTEST_REGION }}
#
# drop the image-artifact steps (the image is already in Artifact Registry), and add
#   --scheduling .platform/engine/chart/loadtest-env/values-gke.example.yaml
# to `loadtest run` so every pod lands on the tainted spot load-test node pool.
name: loadtest-reusable

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the service's loadtest.yaml
        type: string
        required: true
      image:
        description: Image under test, e.g. localhost:5001/sample-api:<sha>
        type: string
        required: true
      image-artifact:
        description: Optional name of an uploaded `docker save` tar, pushed to `image` before the run
        type: string
        required: false
        default: ""
      service:
        description: Service name (one load test per service at a time)
        type: string
        required: true
      platform-repository:
        description: >-
          Repository that hosts this workflow and the platform code (owner/name). Default:
          the calling repository, which is only right when the caller is this repository.
          Callers in other repositories must set it.
        type: string
        required: false
        default: ""
      platform-ref:
        description: >-
          Platform ref to check out (tag, branch or SHA). Default: github.sha, the caller's
          commit, which is only right when the caller is this repository. Callers in other
          repositories must set it, normally to the same ref as the `uses: ...@<ref>`.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write # PR comment with the result table

env:
  # Tool versions match the local toolchain (ruling R5).
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  HELM_VERSION: v4.3.1
  TERRAFORM_VERSION: 1.16.6

jobs:
  loadtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: loadtest-${{ inputs.service }}
      cancel-in-progress: false
    env:
      CONFIG: ${{ inputs.config-path }}
      IMAGE: ${{ inputs.image }}
      IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The service's repository: config, seed, stubs, scenario.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The platform code, at the platform's ref (never from the service's PR).
      - name: Check out platform
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.platform-repository || github.repository }}
          ref: ${{ inputs.platform-ref || github.sha }}
          path: .platform
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .platform/engine/cli/pyproject.toml

      - name: Install loadtest CLI
        run: pip install -q -e .platform/engine/cli

      # Config errors also go to results/summary.md, so the job summary and the PR comment
      # show them.
      - name: Validate config
        run: |
          if ! loadtest validate "$CONFIG" --image "$IMAGE" 2> "$RUNNER_TEMP/validate.err"; then
            cat "$RUNNER_TEMP/validate.err" >&2
            mkdir -p results
            {
              echo "## ⚠️ CONFIG INVALID"
              echo
              echo '```'
              cat "$RUNNER_TEMP/validate.err"
              echo '```'
            } > results/summary.md
            exit 2
          fi

      - name: Estimate cost
        run: loadtest estimate "$CONFIG" --image "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Start kind cluster, registry and platform baseline
        id: kind
        run: .platform/scripts/kind-up.sh

      - name: Download image artifact
        if: inputs.image-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image

      - name: Push image to the local registry
        if: inputs.image-artifact != ''
        run: |
          loaded=""
          for tar in "$RUNNER_TEMP"/image/*.tar; do
            loaded="$(docker load -i "$tar" | sed -n 's/^Loaded image: //p' | tail -n 1)"
          done
          if [ -z "$loaded" ]; then
            echo "::error::no image found in artifact $IMAGE_ARTIFACT"
            exit 1
          fi
          docker tag "$loaded" "$IMAGE"
          docker push "$IMAGE"

      - name: Run load test
        id: run
        continue-on-error: true
        run: |
          set +e
          loadtest run "$CONFIG" --image "$IMAGE" --run-id "$RUN_ID" --out results
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Job summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No load-test results (the run did not start)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-results
          path: results/
          if-no-files-found: warn

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('results/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file results/summary.md --edit-last ||
            gh pr comment "$PR" --body-file results/summary.md

      # The CLI already tears down in `finally`; this covers a CLI that was killed mid-run.
      # Never fails (a missing namespace is only a warning).
      - name: Teardown
        if: always() && (steps.kind.outcome == 'success' || steps.kind.outcome == 'failure')
        run: loadtest teardown --config "$CONFIG" --run-id "$RUN_ID"

      - name: Fail on load-test failure
        if: always() && steps.run.outcome == 'failure'
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        run: |
          case "$EXIT_CODE" in
            1) echo "::error::thresholds failed (exit 1)" ;;
            2) echo "::error::config invalid (exit 2)" ;;
            3) echo "::error::platform error (exit 3)" ;;
            *) echo "::error::load test failed (exit ${EXIT_CODE:-unknown})" ;;
          esac
          exit 1
