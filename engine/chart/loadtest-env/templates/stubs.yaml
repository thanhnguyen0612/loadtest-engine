{{- range .Values.stubs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-mappings
  labels:
    {{- include "loadtest-env.labels" $ | nindent 4 }}
data:
  {{- range $file, $json := .mappings }}
  {{ $file | quote }}: {{ $json | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    {{- include "loadtest-env.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      {{- include "loadtest-env.scheduling" $ | nindent 6 }}
      securityContext:
        {{- /* wiremock image ships user 1000 (ubuntu) */}}
        {{- include "loadtest-env.podSecurity" (dict "uid" 1000) | nindent 8 }}
      containers:
        - name: wiremock
          image: {{ $.Values.images.wiremock | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- include "loadtest-env.resources" $.Values.platform.stub | nindent 12 }}
          securityContext:
            {{- include "loadtest-env.containerSecurity" $ | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
              readOnly: true
            - name: files
              mountPath: /home/wiremock/__files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mappings
          configMap:
            name: {{ .name }}-mappings
        - name: files
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "loadtest-env.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - port: 8080
      targetPort: 8080
---
{{- end }}
