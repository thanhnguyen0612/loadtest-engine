{{- if .Values.database.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-seed
  labels:
    {{- include "loadtest-env.labels" . | nindent 4 }}
data:
  seed.sql: {{ .Values.database.seedSql | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "loadtest-env.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      {{- include "loadtest-env.scheduling" . | nindent 6 }}
      securityContext:
        {{- include "loadtest-env.podSecurity" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          ports:
            - containerPort: 5432
          env:
            # Throwaway database inside an isolated, ephemeral namespace: these are NOT secrets.
            - name: POSTGRES_USER
              value: loadtest
            - name: POSTGRES_PASSWORD
              value: loadtest
            - name: POSTGRES_DB
              value: loadtest
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "loadtest", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- include "loadtest-env.resources" .Values.platform.postgres | nindent 12 }}
          securityContext:
            {{- include "loadtest-env.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: seed
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: seed
          configMap:
            name: postgres-seed
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "loadtest-env.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
