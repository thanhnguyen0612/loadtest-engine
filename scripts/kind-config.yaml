# Shared local cluster for the load-testing platform (created by scripts/kind-up.sh).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: loadtest
networking:
  # Calico replaces kindnet so NetworkPolicies are enforced.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
# Pull localhost:5001/* from the kind-registry container (hosts.toml written by kind-up.sh).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
